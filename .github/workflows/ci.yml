name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install ".[development]"

      - name: Lint
        run: |
          ruff check source tests
          ruff format --check source tests

      - name: Type check
        run: mypy source

      - name: Test
        run: pytest
