# Public edge for the dashboard. The API has no authentication, so this is the
# only thing exposed to the internet: it rate-limits per client IP and proxies
# to the API, which stays internal. ClickHouse is never reachable from here.

# Per-IP request rate. 5 req/s sustained with a burst of 20 is generous for a
# person browsing charts and cheap to serve, while capping abuse of a small
# host. Excess requests get 429 rather than queueing.
limit_req_zone $binary_remote_addr zone=charts:10m rate=5r/s;

# Bound concurrent connections per IP too, so a single client cannot hold many
# slow connections open on a memory-tight box.
limit_conn_zone $binary_remote_addr zone=charts_conn:10m;

server {
    listen 8000;
    server_name _;

    # The dashboard is small static files plus JSON; a modest body is all a
    # reader ever sends.
    client_max_body_size 64k;

    location / {
        limit_req zone=charts burst=10 nodelay;
        limit_req_status 429;
        # A page load fires a handful of parallel requests; more than this from
        # one IP is abuse. Kept low so a flood cannot pile concurrent heavy
        # chart queries onto a memory-tight ClickHouse.
        limit_conn charts_conn 4;
        limit_conn_status 429;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
