# Production stack for the jump host (Debian, 1 core, 1.9 GiB RAM shared with
# four WireGuard containers). A standalone file, not an override: the memory
# limits and ClickHouse config differ from local development on purpose.
#
#   docker compose -f docker-compose.jump.yml up -d
#
# Ports bind to 127.0.0.1 only. The dashboard and API are reached over an SSH
# tunnel, never exposed to the internet; ClickHouse is never published at all.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: soulseek_charts_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-soulseek_charts}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-soulseek_charts}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse-jump/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./infrastructure/clickhouse-jump/users.d/limits.xml:/etc/clickhouse-server/users.d/limits.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1200M
        reservations:
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  collector:
    build:
      context: .
      dockerfile: infrastructure/python/Dockerfile
    container_name: soulseek_charts_collector
    restart: unless-stopped
    command: python -m soulseek_charts.collector
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
        reservations:
          memory: 160M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: infrastructure/python/Dockerfile
    container_name: soulseek_charts_api
    restart: unless-stopped
    command: uvicorn soulseek_charts.api.application:application --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  clickhouse_data:
